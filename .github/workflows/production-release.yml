          PRODUCTION_VERIFY_TOKEN: ${{ secrets.PRODUCTION_VERIFY_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_WORK_ITEMS: ${{ inputs.work_items }}
        run: node scripts/release.mjs
